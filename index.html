<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M. EDDARRAZY | DIGITAL CREATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cinema-black': '#0a0a0a',
              'cinema-white': '#eaeaea',
              'accent-orange': '#ff3c00',
            },
            fontFamily: {
              sans: ['"Manrope"', 'sans-serif'],
              display: ['"Syne"', 'sans-serif'],
            },
            cursor: {
              none: 'none',
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'reveal': 'reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-glow': 'pulseGlow 3s infinite ease-in-out',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              reveal: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.5' },
                '50%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a0a;
        color: #eaeaea;
        overflow-x: hidden;
        cursor: none; /* Hide default cursor for custom one */
      }
      
      /* Film Grain Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Custom Cursor */
      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: exclusion;
        transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease;
        transform: translate(-50%, -50%);
      }

      .custom-cursor.hovered {
        width: 80px;
        height: 80px;
        background: white;
        opacity: 0.1;
      }

      /* Hide scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }

      .text-stroke {
        -webkit-text-stroke: 1px rgba(255,255,255,0.3);
        color: transparent;
        transition: all 0.5s ease;
      }
      
      .text-stroke:hover {
        -webkit-text-stroke: 1px #fff;
        color: #fff;
      }

      .clip-text-reveal {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
      }
      
      /* Scroll Reveal Animation */
      .animate-on-scroll {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      
      .animate-on-scroll.in-view {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Stagger delays */
      .delay-100 { transition-delay: 100ms; }
      .delay-200 { transition-delay: 200ms; }
      .delay-300 { transition-delay: 300ms; }

      @media (max-width: 768px) {
        body {
          cursor: auto;
        }
        .custom-cursor {
          display: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<script>
  // Simple Intersection Observer for scroll animations
  document.addEventListener('DOMContentLoaded', () => {
    const observerOptions = {
      root: null,
      rootMargin: '0px',
      threshold: 0.1
    };

    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target); // Only animate once
        }
      });
    }, observerOptions);

    // Function to attach observer to elements (in case of dynamic rendering)
    window.attachScrollAnimations = () => {
       document.querySelectorAll('.animate-on-scroll').forEach(el => {
         observer.observe(el);
       });
    };

    // Initial attach
    setTimeout(window.attachScrollAnimations, 100);
    
    // Re-attach periodically for React updates if needed, though mostly static
    setInterval(() => {
        const newElements = document.querySelectorAll('.animate-on-scroll:not(.in-view):not([data-observed="true"])');
        newElements.forEach(el => {
            el.setAttribute('data-observed', 'true');
            observer.observe(el);
        });
    }, 1000);
  });
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
